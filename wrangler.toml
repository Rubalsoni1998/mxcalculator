name = "mxcalculator"
main = "src/worker.js"
compatibility_date = "2026-11-01"

# Static files (every page, JS, images, legal pages) are served straight from Cloudflare's edge
# without running any code - that is what makes the site fast. dist/ is built from public/ by
# `npm run build` (inlined CSS, fingerprinted JS, _redirects). Only the paths below wake the Worker.
[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "none"            # keep URLs exactly as written (e.g. /calculators/bmi-calculator.html)
not_found_handling = "404-page"   # serves 404.html
run_worker_first = [
  "/sitemap.xml",
  "/admin",
  "/admin/*",
  "/_mx/*"
]

# Custom domain (domain must be on Cloudflare). Uncomment, or add it in the dashboard under Workers > Settings > Domains.
# routes = [
#   { pattern = "mxcalculator.com", custom_domain = true },
#   { pattern = "www.mxcalculator.com", custom_domain = true }
# ]

[vars]
ADMIN_USER = "admin"
# The admin password is a SECRET, not a var:  npx wrangler secret put ADMIN_PASSWORD

[[d1_databases]]
binding = "DB"
database_name = "mxcalculator"
database_id = "8f428a53-15c9-40dd-b6d2-eb33df0f87d5"
migrations_dir = "migrations"

# Daily housekeeping: retention cleanup, expired admin sessions.
[triggers]
crons = ["17 3 * * *"]
